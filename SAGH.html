<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login y Pantalla Docente/Estudiante</title>
    <style>
        /* Estilo general */
        body {
    font-family: 'Arial', sans-serif;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column; /* Permite el crecimiento vertical del contenido */
    justify-content: flex-start;
    align-items: center;
    min-height: 100vh; /* Ajusta el alto mínimo al tamaño de la ventana */
    background: linear-gradient(135deg, #74b9ff, #0984e3);
    color: #fff;
    overflow-x: auto; /* Permite el desplazamiento horizontal */
}


.docente-container, .estudiante-container {
    background: #ffffff;
    color: #333;
    border-radius: 10px;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    padding: 30px;
    text-align: center;
    min-width: calc(50% + 50px); /* Extra sobre el contenido */
    width: fit-content; /* Ajusta al contenido */
    margin: 0 auto; /* Centra horizontalmente */
}


table {
    width: 100%; /* Mantén esto para tablas responsivas */
}

.docente-container, .estudiante-container {
    overflow-x: auto; /* Agrega desplazamiento horizontal si es necesario */
}


        .login-container, .docente-container, .estudiante-container {
            background: #ffffff;
            color: #333;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
            padding: 30px;
            text-align: center;
        }

        h1 {
            margin-bottom: 20px;
            font-size: 24px;
            font-weight: bold;
        }

        input, button, select {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #dfe6e9;
            border-radius: 5px;
            font-size: 16px;
        }

        button {
            background-color: #0984e3;
            color: #fff;
            cursor: pointer;
        }

        button:hover {
            background-color: #74b9ff;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        table, th, td {
            border: 1px solid #ccc;
        }

        th, td {
            padding: 8px;
            text-align: center;
        }

        th {
            background-color: #0984e3;
            color: #fff;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <!-- Login -->
    <div class="login-container" id="loginContainer">
        <h1>Iniciar Sesión</h1>
        <input type="text" id="username" placeholder="Usuario" required>
        <input type="password" id="password" placeholder="Contraseña" required>
        <button onclick="login()">Ingresar</button>
        <p class="error" id="error"></p>
    </div>

    <!-- Pantalla Docente -->
    <div class="docente-container hidden" id="docenteContainer">
        <h1>Bienvenido, Docente</h1>
        <form id="docenteForm" onsubmit="agregarClase(event)">
            <input type="text" id="materia" placeholder="Materia" required>
            <input type="text" id="docente" placeholder="Docente" required>
            <select id="dia" required>
                <option value="" disabled selected>Seleccione el día</option>
                <option value="Lunes">Lunes</option>
                <option value="Martes">Martes</option>
                <option value="Miércoles">Miércoles</option>
                <option value="Jueves">Jueves</option>
                <option value="Viernes">Viernes</option>
                <option value="Sábado">Sábado</option>
                <option value="Domingo">Domingo</option>
            </select>
            <select id="hora" required>
                <!-- Las opciones se generarán dinámicamente con JavaScript -->
            </select>
            <input type="text" id="aula" placeholder="Aula" required>
            <button type="submit">Agregar Clase</button>
        </form>
        
        <table id="tablaMaterias">
            <thead>
                <tr>
                    <th>Materia</th>
                    <th>Docente</th>
                    <th>Día</th>
                    <th>Hora</th>
                    <th>Aula</th>
                    <th>Accion</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
        <button onclick="logout()">Cerrar Sesión</button>
    </div>

    

    <!-- Pantalla Estudiante -->
    <div class="estudiante-container hidden" id="estudianteContainer">
        <h1>Bienvenido, Estudiante</h1>
        <table id="tablaEstudiante">
            <thead>
                <tr>
                    <th>Materia</th>
                    <th>Docente</th>
                    <th>Día</th>
                    <th>Hora</th>
                    <th>Aula</th>
                    <th>Acción</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>

        <!-- Tabla de Horario -->
        <h2>Horario</h2>
        <table id="tablaHorario">
            <thead>
                <tr>
                    <th>Hora</th>
                    <th>Lunes</th>
                    <th>Martes</th>
                    <th>Miércoles</th>
                    <th>Jueves</th>
                    <th>Viernes</th>
                    <th>Sábado</th>
                </tr>
            </thead>
            <tbody>
                <!-- Generar dinámicamente filas de horas -->
            </tbody>
        </table>
        <button onclick="logout()">Cerrar Sesión</button>
    </div>

    <script>

        const usuarios = [
            { username: 'docente123', password: 'docente123', role: 'docente' },
            { username: 'estudiante123', password: 'estudiante123', role: 'estudiante' }
        ];

        function login() {
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;
    const error = document.getElementById('error');

    const usuario = usuarios.find(user => user.username === username && user.password === password);

    if (usuario) {
        document.getElementById('loginContainer').classList.add('hidden');

        if (usuario.role === 'docente') {
            iniciarPantallaDocente(); // Carga la pantalla docente y datos
        } else if (usuario.role === 'estudiante') {
            cargarClases(); // Carga las clases para el estudiante
            document.getElementById('estudianteContainer').classList.remove('hidden');
        }
    } else {
        error.textContent = 'Usuario o contraseña incorrectos.';
    }
}

function iniciarPantallaDocente() {
    cargarClasesDocente(); // Carga las clases guardadas
    document.getElementById('docenteContainer').classList.remove('hidden');
}

function cargarClasesDocente() {
    const tabla = document.getElementById('tablaMaterias').getElementsByTagName('tbody')[0];
    tabla.innerHTML = ''; // Limpia la tabla antes de cargar

    const clases = JSON.parse(localStorage.getItem('clases')) || [];

    clases.forEach(clase => {
        const nuevaFila = tabla.insertRow();
        nuevaFila.innerHTML = `
            <td>${clase.materia}</td>
            <td>${clase.docente}</td>
            <td>${clase.dia}</td>
            <td>${clase.hora}</td>
            <td>${clase.aula}</td>
            <td><button onclick="eliminarClase('${clase.materia}', '${clase.dia}', '${clase.hora}')">Eliminar</button></td>
        `;
    });
}

        function logout() {
            document.getElementById('loginContainer').classList.remove('hidden');
            document.getElementById('docenteContainer').classList.add('hidden');
            document.getElementById('estudianteContainer').classList.add('hidden');
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
        }

        function agregarClase(event) {
    event.preventDefault();
    const materia = document.getElementById('materia').value;
    const docente = document.getElementById('docente').value;
    const dia = document.getElementById('dia').value;
    const hora = document.getElementById('hora').value;
    const aula = document.getElementById('aula').value;

    const nuevaClase = { materia, docente, dia, hora, aula };
    guardarClase(nuevaClase);

    cargarClasesDocente(); // Actualiza la tabla
    document.getElementById('docenteForm').reset();
}

function eliminarClase(materia, dia, hora) {
    let clases = JSON.parse(localStorage.getItem('clases')) || [];
    clases = clases.filter(clase => !(clase.materia === materia && clase.dia === dia && clase.hora === hora));
    localStorage.setItem('clases', JSON.stringify(clases));
    cargarClasesDocente(); // Actualiza la tabla
}


        function guardarClase(clase) {
            let clases = JSON.parse(localStorage.getItem('clases')) || [];
            clases.push(clase);
            localStorage.setItem('clases', JSON.stringify(clases));
        }

        function cargarClases() {
    const tabla = document.getElementById('tablaEstudiante').getElementsByTagName('tbody')[0];
    tabla.innerHTML = ''; // Limpiar tabla
    const clases = JSON.parse(localStorage.getItem('clases')) || [];

    clases.forEach(clase => {
        const fila = tabla.insertRow();
        fila.innerHTML = `
            <td>${clase.materia}</td>
            <td>${clase.docente}</td>
            <td>${clase.dia}</td>
            <td>${clase.hora}</td>
            <td>${clase.aula}</td>
            <td>
                <button onclick="agregarMateriaHorario('${clase.dia}', '${clase.hora}', '${clase.materia}', '${clase.docente}', '${clase.aula}')">Agregar</button>
                <button onclick="eliminarMateriaHorario('${clase.dia}', '${clase.hora}', '${clase.materia}')">Eliminar</button>
            </td>
        `;
    });

    cargarHorario(); // Carga el horario guardado
}

function generarOpcionesHoras() {
    const selectHora = document.getElementById('hora');
    selectHora.innerHTML = ''; // Limpia cualquier opción previa

    const inicio = 6; // Hora inicial: 6:00 AM
    const fin = 21;  // Hora final: 9:00 PM

    for (let hora = inicio; hora <= fin; hora++) {
        const formatoHora = hora > 12 ? `${hora - 12}:00 PM` : `${hora}:00 AM`;
        const valorHora = hora < 10 ? `0${hora}:00` : `${hora}:00`; // Formato 24 horas
        const option = document.createElement('option');
        option.value = valorHora;
        option.textContent = formatoHora;
        selectHora.appendChild(option);
    }
}

// Llama a la función al cargar la página
window.onload = function () {
    generarOpcionesHoras();
};


function agregarMateriaHorario(dia, hora, materia, docente, aula) {
    const tablaHorario = document.getElementById('tablaHorario');
    const filas = [...tablaHorario.rows];
    const dias = ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];

    // Encuentra la fila que coincide con la hora
    const fila = filas.find(row => row.cells[0]?.textContent.trim() === hora);

    if (fila) {
        const columna = dias.indexOf(dia) + 1;

        // Validar si la celda ya está ocupada
        if (fila.cells[columna]?.textContent.trim()) {
            alert('La celda ya contiene una materia. Elimina la existente antes de agregar una nueva.');
            return;
        }

        // Actualiza la celda correspondiente con los datos
        fila.cells[columna].innerHTML = `
            <strong>${materia}</strong><br>
            <span style="font-size: 0.9em; color: gray;">${docente}</span><br>
            <span style="font-size: 0.8em; color: darkgray;">${aula}</span>
        `;

        guardarHorario(); // Guarda el horario actualizado
    } else {
        alert("La hora seleccionada no está en el horario.");
    }
}


function eliminarMateriaHorario(dia, hora, materia) {
    const tablaHorario = document.getElementById('tablaHorario');
    const filas = [...tablaHorario.rows];
    const dias = ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];

    // Encuentra la fila que coincide con la hora
    const fila = filas.find(row => row.cells[0]?.textContent.trim() === hora);

    if (fila) {
        const columna = dias.indexOf(dia) + 1;

        // Verifica si la celda contiene la materia que se desea eliminar
        if (fila.cells[columna]?.innerHTML.includes(materia)) {
            fila.cells[columna].innerHTML = ''; // Vacía el contenido de la celda
            guardarHorario(); // Guarda el horario actualizado
        } else {
            alert('La materia indicada no está presente en esta celda.');
        }
    } else {
        alert('La hora seleccionada no existe en el horario.');
    }
}





        function guardarHorario() {
    const tablaHorario = document.getElementById('tablaHorario');
    const horario = [];

    // Recorremos las filas y celdas de la tabla para guardar el contenido
    [...tablaHorario.rows].forEach((fila, i) => {
        if (i === 0) return; // Saltamos la fila de encabezado
        const celdas = [...fila.cells].map(cell => cell.textContent.trim());
        horario.push(celdas);
    });

    localStorage.setItem('horario', JSON.stringify(horario));
}


function cargarHorario() {
    const horarioGuardado = JSON.parse(localStorage.getItem('horario')) || [];

    const tablaHorario = document.getElementById('tablaHorario');
    tablaHorario.innerHTML = ''; // Limpiamos la tabla antes de cargar el horario

    // Generamos encabezado manualmente
    const encabezado = tablaHorario.createTHead().insertRow();
    encabezado.innerHTML = `
        <th>Hora</th>
        <th>Lunes</th>
        <th>Martes</th>
        <th>Miércoles</th>
        <th>Jueves</th>
        <th>Viernes</th>
        <th>Sábado</th>
    `;

    const tbody = tablaHorario.createTBody();

    // Inicializar horario si está vacío
    if (horarioGuardado.length === 0) {
        const horas = ["06:00", "07:00", "08:00", "09:00", "10:00", "11:00", "12:00", "13:00", "14:00", "15:00", "16:00", "17:00", "18:00", "19:00"];
        horas.forEach(hora => {
            const fila = tbody.insertRow();
            fila.insertCell().textContent = hora; // Primera celda: hora
            for (let i = 0; i < 6; i++) { // Celdas vacías para cada día
                fila.insertCell().textContent = "";
            }
        });
    } else {
        // Si hay horario guardado, cargarlo
        horarioGuardado.forEach(fila => {
            const nuevaFila = tbody.insertRow();
            fila.forEach(celda => {
                const nuevaCelda = nuevaFila.insertCell();
                nuevaCelda.textContent = celda;
            });
        });
    }
}


    </script>
</body>
</html>
