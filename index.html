<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pantalla de Login</title>
    <style>
        /* Estilos básicos para el diseño */
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #6A11CB, #2575FC);
            color: #fff;
        }

        .login-container {
            background: #fff;
            color: #333;
            width: 360px;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .login-form h2 {
            margin-bottom: 20px;
            font-size: 24px;
            text-align: center;
            color: #333;
        }

        .login-form input {
            width: 93%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        .login-form button {
            width: 100%;
            padding: 10px;
            background: #2575FC;
            border: 2px solid #2575FC;
            border-radius: 8px;
            font-size: 16px;
            color: #fff;
            cursor: pointer;
            transition: background 0.5s;
        }

        .login-form button:hover {
            background: #fff;
            color: #2575FC;
            border: 2px solid #2575FC;
        }

        .error {
            color: red;
            font-size: 14px;
            text-align: center;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <form class="login-form" id="loginForm">
            <h2>Iniciar Sesión</h2>
            <div id="errorMessage" class="error"></div>
            <input type="text" id="username" placeholder="Usuario" required>
            <input type="password" id="password" placeholder="Contraseña" required>
            <button type="submit">Ingresar</button>
        </form>
    </div>

    <script>
    // Usuarios válidos con roles
const users = {
    docente: "1234",
    estudiante: "1234"
};

// Manejo del formulario
const loginForm = document.getElementById("loginForm");
const errorMessage = document.getElementById("errorMessage");

loginForm.addEventListener("submit", function (e) {
    e.preventDefault();
    
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value.trim();

    if (users[username] && users[username] === password) {
        if (username === "docente") {
            alert("Bienvenido, Docente!");
            window.location.href = "docente.html"; // Redirige a la pantalla docente
        } else if (username === "estudiante") {
            alert("Bienvenido, Estudiante!");
            window.location.href = "estudiante.html"; // Redirige a la pantalla de estudiante
        }
    } else {
        errorMessage.textContent = "Usuario o contraseña incorrectos.";
    }
});

    </script>
</body>
</html>
